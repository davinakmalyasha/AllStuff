name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Go API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bizverse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: services/api/go.sum
      - run: go vet ./...
      - run: go build ./...
      - name: Run migrations
        run: go run ./cmd/api -migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/bizverse?sslmode=disable
          MIGRATIONS_DIR: ../../infra/postgres/migrations
      - name: Seed demo content
        run: |
          sudo apt-get update -q && sudo apt-get install -yq postgresql-client
          psql "postgres://postgres:postgres@localhost:5432/bizverse?sslmode=disable" -v ON_ERROR_STOP=1 -f ../../scripts/seed.sql
      - run: go test ./...
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/bizverse?sslmode=disable

  frontend:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    name: E2E smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bizverse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: services/api/go.sum
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Prerender needs the API running with seeded data; do it in one job.
      - name: Migrate + seed
        run: |
          cd ../../services/api
          go run ./cmd/api -migrate
          psql "postgres://postgres:postgres@localhost:5432/bizverse?sslmode=disable" -v ON_ERROR_STOP=1 -f ../../scripts/seed.sql
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/bizverse?sslmode=disable
          MIGRATIONS_DIR: ../../infra/postgres/migrations
      - run: npx playwright test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/bizverse?sslmode=disable
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
      # Prerender public routes for SEO; failures must not pass silently.
      - name: Prerender
        run: |
          npm run build
          (cd ../../services/api && go run ./cmd/api > /dev/null 2>&1 &)
          (npx vite preview --port 5173 > /dev/null 2>&1 &)
          sleep 8
          node scripts/prerender.mjs
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/bizverse?sslmode=disable
          MIGRATIONS_DIR: ../../infra/postgres/migrations
