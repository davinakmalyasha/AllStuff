<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" id="meta-theme-color" />
    <!-- Backstop CSP: the app has no raw-HTML sinks today; this bounds the
         blast radius of future regressions. Map tiles + media are the only
         cross-origin image needs; Vite injects module scripts from 'self'
         and Tailwind requires inline style attributes. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tiles.openstreetmap.org https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org /api/v1/media; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    />
    <title>BizVerse — Every business. One place.</title>
    <meta name="description" content="Every business in the world, in one place. Find, compare, and contact any business." />
    <meta property="og:title" content="BizVerse — Every business. One place." />
    <meta property="og:description" content="Every business in the world, in one place. Find, compare, and contact any business." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="/" />
    <meta property="og:site_name" content="BizVerse" />
    <script>
      // FOUC guard: apply theme before first paint. Default is LIGHT (white).
      ;(function () {
        try {
          var stored = localStorage.getItem('bv.theme')
          var dark = stored ? stored === 'dark' : false
          document.documentElement.classList.toggle('dark', dark)
          var meta = document.getElementById('meta-theme-color')
          if (meta) meta.setAttribute('content', dark ? '#0a0a0a' : '#ffffff')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
